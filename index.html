<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javinha do Script</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Javones do Script</h1>
    <section>
        <h2>Horário atual</h2>
        <p id="relogio">00:00:00</p>
    </section>
    <section>
        <h2>Entrada no evento</h2>
        <input type="number" id="idade" placeholder="Digite sua idade">
        <button id="verificar">Verificar idade</button>
        <p id="resultado"></p>
    </section>
    <section>
        <h2>Aquele tema tá</h2>
        <button id="tema">Mudar tema</button>
    </section>
</body>
</html>
